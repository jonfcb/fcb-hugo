{{ define "main" }}
  <section class="es-page-heading"><div class="container"><p class="es-eyebrow">Our projects</p><h1>{{ .Title }}</h1></div></section>
  <section class="es-section"><div class="container">
    {{ with .Params.cover }}<img class="es-project-cover" src="{{ . | relURL }}" alt="{{ $.Title }} by EliteStead" width="1170" height="780" fetchpriority="high">{{ end }}
    {{ with .Params.info }}<aside class="es-project-info"><h2>Project information</h2><dl>{{ range .detail }}<dt>{{ .key }}</dt><dd>{{ .value | safeHTML }}</dd>{{ end }}</dl></aside>{{ end }}
    <div class="content es-project-content">{{ .Content }}</div>
    <a class="es-text-link" href="{{ "projects/" | relURL }}">Explore all projects →</a>
  </div></section>
  {{ partial "project-enquiry.html" . }}
{{ end }}
